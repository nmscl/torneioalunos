          document.documentElement.setAttribute(attr.name,attr.value);
        }

        // 2. Limpar e preencher <head> (meta, fontes, links, estilos)
        var headNodes=[];
        for(var i=0;i<doc.head.childNodes.length;i++){
          var node=doc.head.childNodes[i];
          if(node.nodeName!=='SCRIPT'){
            headNodes.push(node.cloneNode(true));
          }
        }
        document.head.innerHTML='';
        headNodes.forEach(function(el){ document.head.appendChild(el); });

        // Adicionar proteção de seleção ao <head>
        var antiSelectStyle=document.createElement('style');
        antiSelectStyle.textContent='*:not(input):not(textarea):not(select){-webkit-user-select:none!important;-moz-user-select:none!important;-ms-user-select:none!important;user-select:none!important;}';
        document.head.appendChild(antiSelectStyle);

        // 3. Copiar atributos do <body> (classes, atributos)
        document.body.className=doc.body.className;
        for(var i=0;i<doc.body.attributes.length;i++){
          var attr=doc.body.attributes[i];
          document.body.setAttribute(attr.name,attr.value);
        }

        // 4. Extrair todos os scripts antes de renderizar o corpo
        var scripts=Array.from(doc.querySelectorAll('script'));
        doc.querySelectorAll('script').forEach(function(s){ s.remove(); });
        document.body.innerHTML=doc.body.innerHTML;

        // 5. Executar scripts sequencialmente garantindo que o Firebase carrega primeiro
        for(var sIdx=0;sIdx<scripts.length;sIdx++){
          var origScript=scripts[sIdx];
          await new Promise(function(resolve){
            var s=document.createElement('script');
            for(var a=0;a<origScript.attributes.length;a++){
              s.setAttribute(origScript.attributes[a].name,origScript.attributes[a].value);
            }
            if(s.src){
              s.onload=function(){ resolve(); };
              s.onerror=function(){
                console.warn('Erro ao carregar script externo:', s.src);
                resolve();
              };
              document.head.appendChild(s);
            }else{
              s.text=origScript.textContent;
              document.body.appendChild(s);
              resolve();
            }
          });
        }
      }catch(err){
        _0xfail('Erro ao verificar integridade: '+err.message);
      }
    }

    }else{
